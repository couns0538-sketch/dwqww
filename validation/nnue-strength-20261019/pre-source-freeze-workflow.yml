name: Bounded native Linux NNUE strength test
on:
  push:
    branches: ['forge/hosted-nnue-strength-20261019-*']
permissions:
  contents: write
jobs:
  nnue-strength:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BASELINE_SHA: '4edda780c68a742f20565d4e6a54a0c99a2c88a6'
      CANDIDATE_SHA: 'PENDING_ROOT_SOURCE_FREEZE'
      FASTCHESS_SHA: '60d7a7a26c6b0582a15c112fb29a1829bef2adb3'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Freeze/build serially before any timing
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hosted-results/artifacts/baseline hosted-results/artifacts/candidate hosted-results/artifacts/runner
          cp -R .github/hosted-nnue-strength hosted-results/package
          cp .github/workflows/forge-hosted-nnue-strength.yml hosted-results/workflow.yml
          cp tools/match/windows_validate.py hosted-results/windows_validate.py
          exec > >(tee hosted-results/build.log) 2>&1
          python3 - <<'PY'
          import importlib.util, json, os, re
          from pathlib import Path
          p = json.loads(Path('.github/hosted-nnue-strength/protocol.json').read_text())
          spec = importlib.util.spec_from_file_location('nnue_gate', '.github/hosted-nnue-strength/run_hosted.py')
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)
          gate.require_launch_protocol(p)
          for key in ('baseline', 'candidate', 'fastchess'):
              value = os.environ[key.upper() + '_SHA']
              assert re.fullmatch('[0-9a-f]{40}', value), 'Unfrozen source SHA'
              assert p[key + '_sha'] == value, 'Workflow/protocol SHA mismatch'
          PY
          if ! command -v g++-14; then
            timeout 60s sudo apt-get update
            timeout 60s sudo apt-get install -y g++-14
          fi
          command -v g++-14
          g++-14 --version
          cmake --version
          mkdir -p hosted-results/source
          for label in baseline candidate; do
            if [ "$label" = baseline ]; then rev="$BASELINE_SHA"; else rev="$CANDIDATE_SHA"; fi
            mkdir -p "$RUNNER_TEMP/src-$label"
            git cat-file -e "$rev^{commit}"
            git archive "$rev" CMakeLists.txt LICENSE src include tests bench tools > "hosted-results/source/$label.tar"
            tar -xf "hosted-results/source/$label.tar" -C "$RUNNER_TEMP/src-$label"
            cmake -S "$RUNNER_TEMP/src-$label" -B "$RUNNER_TEMP/build-$label" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_CXX_FLAGS= -DCMAKE_CXX_FLAGS_RELEASE='-O3 -DNDEBUG -march=x86-64-v3 -mtune=generic -fno-fast-math -ffp-contract=off -fno-lto' -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF -DFORGE_NATIVE=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            cmake --build "$RUNNER_TEMP/build-$label" -j2
            cp "$RUNNER_TEMP/build-$label/forge" "hosted-results/artifacts/$label/forge"
            cp "$RUNNER_TEMP/build-$label/libforge_core.a" "hosted-results/artifacts/$label/libforge_core.a"
            cp "$RUNNER_TEMP/build-$label/compile_commands.json" "hosted-results/$label-compile-commands.json"
            cp "$RUNNER_TEMP/build-$label/CMakeCache.txt" "hosted-results/$label-CMakeCache.txt"
            ctest_rc=0
            ctest --test-dir "$RUNNER_TEMP/build-$label" --output-on-failure || ctest_rc=$?
            cp "$RUNNER_TEMP/build-$label/Testing/Temporary/LastTest.log" "hosted-results/$label-LastTest.log"
            python3 - "$label" "$rev" <<'PYBUILD'
          import hashlib, json, os, sys
          from pathlib import Path
          label, commit = sys.argv[1:]
          src = Path(os.environ['RUNNER_TEMP']) / ('src-' + label)
          build = Path(os.environ['RUNNER_TEMP']) / ('build-' + label)
          files = [p for p in src.rglob('*') if p.is_file()]
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          record = {'source_commit': commit, 'exported_source_sha256': {p.relative_to(src).as_posix(): digest(p) for p in sorted(files)}, 'built_artifacts_sha256': {name: digest(build/name) for name in ('forge','libforge_core.a')}, 'last_test_log_sha256': digest(build/'Testing/Temporary/LastTest.log'), 'source_tar_sha256': digest(Path('hosted-results/source/'+label+'.tar'))}
          Path('hosted-results/'+label+'-build-provenance.json').write_text(json.dumps(record,indent=2)+'\n')
          PYBUILD
            test "$ctest_rc" = 0
          done
          git clone https://github.com/Disservin/fastchess.git "$RUNNER_TEMP/fastchess"
          git -C "$RUNNER_TEMP/fastchess" checkout --detach "$FASTCHESS_SHA"
          test "$(git -C "$RUNNER_TEMP/fastchess" rev-parse HEAD)" = "$FASTCHESS_SHA"
          git -C "$RUNNER_TEMP/fastchess" archive HEAD > hosted-results/source/fastchess.tar
          make -C "$RUNNER_TEMP/fastchess" -j2 CXX=g++-14
          "$RUNNER_TEMP/fastchess/fastchess" -version
          cp "$RUNNER_TEMP/fastchess/fastchess" hosted-results/artifacts/runner/fastchess
          python3 - <<'PYARCHIVE'
          import hashlib, json
          from pathlib import Path
          root = Path('hosted-results/artifacts')
          files = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          Path('hosted-results/artifacts-SHA256.json').write_text(json.dumps(files, indent=2)+'\n')
          PYARCHIVE
          cp .github/hosted-nnue-strength/protocol.json hosted-results/
          cp .github/hosted-nnue-strength/provenance/openings-selection.json hosted-results/
      - name: Calibrate then run one bounded 1024-pair native SPRT
        timeout-minutes: 310
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/hosted-nnue-strength/run_hosted.py --repo "$GITHUB_WORKSPACE" --package "$GITHUB_WORKSPACE/.github/hosted-nnue-strength" --baseline "$GITHUB_WORKSPACE/hosted-results/artifacts/baseline/forge" --candidate "$GITHUB_WORKSPACE/hosted-results/artifacts/candidate/forge" --fastchess "$GITHUB_WORKSPACE/hosted-results/artifacts/runner/fastchess" --out "$GITHUB_WORKSPACE/hosted-results/strength" 2>&1 | tee hosted-results/wrapper.log
      - name: Archive every original evidence byte for permanent Git preservation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hosted-results
          python3 -B .github/hosted-nnue-strength/archive_results.py --input "$GITHUB_WORKSPACE/hosted-results" --out "$GITHUB_WORKSPACE/archived-results" --name "nnue-strength-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Upload all raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-hosted-nnue-strength-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hosted-results/
            archived-results/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve evidence on a fresh results branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          branch="results/nnue-strength-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p hosted-results
          git switch --orphan "$branch"
          git rm -rf --cached --ignore-unmatch . >/dev/null
          test -n "$(find archived-results -name '*.manifest.json' -print -quit)"
          git add -f archived-results
          git -c user.name='Forge validation CI' -c user.email='forge-validation@users.noreply.github.com' commit -m "Preserve bounded native Linux NNUE strength evidence $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          git push origin "HEAD:refs/heads/$branch"
