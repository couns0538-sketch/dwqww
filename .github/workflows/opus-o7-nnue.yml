# O7 (UCI NNUEPawnPairs) evidence on Linux (branch opus-O7): pawn-pair and threat tests, C4 v2 regression, identity,
# zero-threat and zero-pawn-pair lock replicas, CPU-torch --pawn-pairs training + 10000-position export parity, planted
# trainer bug and NPS on a quiet runner (opus_round1/O7/ci_o7.sh). Read-only; uploads logs as artifacts.
name: opus-o7-nnue
on:
  push:
    branches: ['opus-O7']
    paths-ignore:
      - 'opus_round1/**/*.md'
      - 'opus_round1/**/*.log'
      - 'opus_round1/**/*.json'
      - 'opus_round1/**/*.tsv'
      - 'opus_round1/**/*.diff'
      - 'opus_round1/**/SHA256SUMS'
      - 'REPORT.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nnue:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Toolchain and CPU torch
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-14 ninja-build cmake
          g++-14 --version | head -1
          python -m pip install -q numpy==1.26.4
          python -m pip install -q torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch, numpy; print(torch.__version__, numpy.__version__)"
          nproc; lscpu | grep -E 'Model name' | cut -c1-120
      - name: O7 evidence
        run: bash opus_round1/O7/ci_o7.sh ci_o7
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opus-o7-nnue
          path: |
            ci_o7/*.log
            ci_o7/*.json
            ci_o7/o7_*/*.json
            ci_o7/o7_*/settings_*.txt
          if-no-files-found: warn
