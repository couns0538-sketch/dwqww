# S27fix on Linux: v2 tests + Sol's own S27 suites against v2 (shim), closing the "v2 on Linux not run" item.
name: opus-sol-s27fix-linux
on:
  push:
    branches: ['opus-sol-S27fix']
    paths-ignore:
      - 'opus_round1/**/*.md'
      - 'opus_round1/**/*.log'
      - 'opus_round1/**/SHA256SUMS'
      - 'opus_round1/**/FILES*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Sol's branch (read-only source of his unchanged suites)
        run: git fetch --no-tags origin forge/sol-pack31-20261025
      - name: v2 tests + Sol's suites on Linux
        run: bash opus_round1/sol_S27fix/ci_s27fix_linux.sh ci_out
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-s27fix-linux
          path: ci_out/*.log
          if-no-files-found: warn
