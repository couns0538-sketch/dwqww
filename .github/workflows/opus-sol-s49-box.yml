# S49 box run: pc_speed_ci_20261027.ps1 on a quiet GitHub runner (no gates; labelled box-only). Builds the lock and a
# TEST-ONLY synthetic 5% slowdown copy, then an A/A run (CI must contain 1.00) and an A/B run (CI must exclude 1.00).
# See opus_round1/sol_S49/ci_s49_box.sh. Read-only; uploads logs as artifacts.
name: opus-sol-s49-box
on:
  push:
    branches: ['opus-sol-S49']
    paths-ignore:
      - 'opus_round1/**/*.md'
      - 'opus_round1/**/*.log'
      - 'opus_round1/**/*.tar.gz'
      - 'opus_round1/**/SHA256SUMS'
      - 'opus_round1/**/FILES.txt'
      - 'REPORT.md'
permissions:
  contents: read
jobs:
  box:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-14 ninja-build cmake python3
          g++-14 --version | head -1
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          nproc; lscpu | grep -E 'Model name' | cut -c1-200
      - name: S49 box run (A/A and synthetic 5% slowdown)
        run: bash opus_round1/sol_S49/ci_s49_box.sh ci_out
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-s49-box
          path: |
            ci_out/*.log
            ci_out/run_aa/*.json
            ci_out/run_aa/*.md
            ci_out/run_aa/*.csv
            ci_out/run_slow5/*.json
            ci_out/run_slow5/*.md
            ci_out/run_slow5/*.csv
          if-no-files-found: warn
