# R13 Phase 3: ASan+UBSan self-play smoke of the Sf26 split on the lock tree (git d4f4312 + sf26split_port.patch).
# R14: config comb = the combined gate line (the three singles at their default margins).
name: opus-r13-san-p3
on:
  push:
    branches: ['opus-r13-p3-sf26split']
    paths: ['opus_r13/p3/sf26/*.patch', 'opus_r13/tools/selfplay_smoke.py', '.github/workflows/opus-r13-san-p3.yml']
  workflow_dispatch:
jobs:
  san:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: lock source + port patch
        run: |
          git fetch -q --depth 1 origin d4f43124dde1d1e37de90e18930e374f32ea7ffa
          mkdir lock && git archive FETCH_HEAD src include | tar -x -C lock
          cd lock && patch -p1 -F0 < "$GITHUB_WORKSPACE/opus_r13/p3/sf26/sf26split_port.patch"
      - name: build ASan+UBSan
        run: |
          cd lock && g++ -std=c++20 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all \
            -DFORGE_NNUE_HIDDEN=256 -DFORGE_EXPOSE_TUNABLES=1 -march=x86-64-v3 -pthread -Iinclude src/*.cpp -o forge_san
      - name: self-play smoke
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          python3 opus_r13/tools/selfplay_smoke.py lock/forge_san --config default "" --config nmp "Sf26NmpPrior=1" \
            --config lmr "Sf26LmrGap=1" --config mc "Sf26MulticutCorr=1" \
            --config comb "Sf26NmpPrior=1;Sf26LmrGap=1;Sf26MulticutCorr=1" \
            --config max "Sf26Bundle=15;Sf26NmpPrior=1;Sf26LmrGap=1;Sf26MulticutCorr=1;Sf26NmpPriorBonus=100;Sf26NmpPriorCap=8;Sf26LmrAlphaGap=50;Sf26RazorAllRelief=300" \
            --games 4 --nodes 20000 --max-plies 160 --out san_sf26
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: san_sf26
          path: san_sf26*
