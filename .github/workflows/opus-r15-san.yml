# R15: ASan+UBSan self-play smoke of each candidate patch on the lock tree (git d4f4312 = src_al1s198_clean).
# Per item: lock source + `patch -p1 -F0` of the candidate patch, g++ -fsanitize=address,undefined, then
# opus_r15/tools/selfplay_smoke.py (legality via the engine's own `go perft 1`, sanitizer lines counted from stderr)
# for the item's configs (default = all OFF, the ON gate line, the option's max). Item "lock" is the unpatched control.
# Runs on every push to the branch (no paths filter); a newer push cancels an older run of the same branch.
name: opus-r15-san
on:
  push:
    branches: ['opus-r15-20261103']
  workflow_dispatch:
concurrency:
  group: opus-r15-san-${{ github.ref }}
  cancel-in-progress: true
jobs:
  san:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - item: lock
            patch: '-'
            configs: 'default='
          - item: c1_prunelmrhist
            patch: opus_r15/cands/c1_prunelmrhist/c1_prunelmrhist.patch
            configs: 'default=|on=PruneLmrHist=1'
          - item: c2_qsmoveprune
            patch: opus_r15/cands/c2_qsmoveprune/c2_qsmoveprune.patch
            configs: 'default=|on=QsMovePrune=3|edge=QsMovePrune=1|max=QsMovePrune=16'
          - item: c3_ttprobcut
            patch: opus_r15/cands/c3_ttprobcut/c3_ttprobcut.patch
            configs: 'default=|on=TtProbcut=360|edge=TtProbcut=1|max=TtProbcut=1000'
          - item: c4_iirshallowtt
            patch: opus_r15/cands/c4_iirshallowtt/c4_iirshallowtt.patch
            configs: 'default=|on=IirShallowTt=1|edge=IirShallowTt=1;IirDepth=1'
          - item: c5_conthistsplit
            patch: opus_r15/cands/c5_conthistsplit/c5_conthistsplit.patch
            configs: 'default=|on=ContHistSplit=1'
          - item: c6_lowplyhist
            patch: opus_r15/cands/c6_lowplyhist/c6_lowplyhist.patch
            configs: 'default=|on=LowPlyHist=1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: lock source + candidate patch
        run: |
          git fetch -q --depth 1 origin d4f43124dde1d1e37de90e18930e374f32ea7ffa
          mkdir lock && git archive FETCH_HEAD src include | tar -x -C lock
          if [ "${{ matrix.patch }}" != "-" ]; then (cd lock && patch -p1 -F0 < "$GITHUB_WORKSPACE/${{ matrix.patch }}"); fi
          sha256sum lock/src/*.cpp lock/include/forge/*.hpp | tee src_sha256.txt
      - name: build ASan+UBSan
        run: |
          cd lock && g++ --version | head -1
          g++ -std=c++20 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all \
            -DFORGE_NNUE_HIDDEN=256 -DFORGE_EXPOSE_TUNABLES=1 -march=x86-64-v3 -pthread -Iinclude src/*.cpp -o forge_san
      - name: self-play smoke
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          args=()
          IFS='|' read -ra cfgs <<< "${{ matrix.configs }}"
          for c in "${cfgs[@]}"; do args+=(--config "${c%%=*}" "${c#*=}"); done
          python3 opus_r15/tools/selfplay_smoke.py lock/forge_san "${args[@]}" --games 4 --nodes 20000 --max-plies 160 --out san_${{ matrix.item }}
      - name: self-play smoke, Threads 2 (ON line only)
        if: matrix.patch != '-'
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          on=$(echo "${{ matrix.configs }}" | tr '|' '\n' | grep '^on=' | cut -d= -f2-)
          python3 opus_r15/tools/selfplay_smoke.py lock/forge_san --config on_t2 "$on" --games 2 --nodes 20000 --max-plies 120 --threads 2 --out san_t2_${{ matrix.item }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: san_${{ matrix.item }}
          path: |
            san_*${{ matrix.item }}*
            src_sha256.txt
