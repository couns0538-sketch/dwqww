# O4 (UCI PureNnue) evidence on Linux (branch opus-O4): PureNnue tests, C4 v2 regression, options-off identity,
# CPU-torch --pure training + 10000-position export parity + engine-level PureNnue evaluation, planted trainer bug,
# evaluation-cost walk and NPS on a quiet runner (opus_round1/O4/ci_o4.sh). Read-only; uploads logs as artifacts.
name: opus-o4-nnue
on:
  push:
    branches: ['opus-O4']
    paths-ignore:
      - 'opus_round1/**/*.md'
      - 'opus_round1/**/*.log'
      - 'opus_round1/**/*.json'
      - 'opus_round1/**/*.tsv'
      - 'opus_round1/**/*.diff'
      - 'opus_round1/**/SHA256SUMS'
      - 'REPORT.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nnue:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Toolchain and CPU torch
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-14 ninja-build cmake
          g++-14 --version | head -1
          python -m pip install -q numpy==1.26.4
          python -m pip install -q torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch, numpy; print(torch.__version__, numpy.__version__)"
          nproc; lscpu | grep -E 'Model name' | cut -c1-120
      - name: O4 evidence
        run: bash opus_round1/O4/ci_o4.sh ci_o4
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opus-o4-nnue
          path: |
            ci_o4/*.log
            ci_o4/*.json
            ci_o4/o4_*/*.json
            ci_o4/o4_*/settings_*.txt
          if-no-files-found: warn
