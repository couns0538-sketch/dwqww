name: Independent teacher data shards

on:
  push:
    branches: ['forge/independent-teacher-ci-20261023', 'forge/independent-teacher-ci-20261023-r1']

permissions:
  contents: write

concurrency:
  group: independent-teacher-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SHARD_ROOT: /workspace/forge-independent-teacher-20261023/ci-shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Establish canonical physical provenance paths
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /workspace
          sudo chown "$USER":"$(id -gn)" /workspace
          test ! -e /workspace/dwqww
          mv "$GITHUB_WORKSPACE" /workspace/dwqww
          ln -s /workspace/dwqww "$GITHUB_WORKSPACE"
      - name: Prove Git checkpoint publication before expensive work
        working-directory: /workspace/dwqww
        run: python3 -B tools/nnue/run_teacher_ci_shard.py --stage started --shard ${{ matrix.shard }} --out "$SHARD_ROOT"
      - name: Install preparation and native build dependencies
        working-directory: /workspace/dwqww
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 1ab50b2dd64d9b2f752f7f1285f6968cad2fd792 5101c2529d386b7c3a04ba9156a69ee34df6bb43
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-14 cmake python3-venv
          python3 -m venv "$SHARD_ROOT/venv"
          "$SHARD_ROOT/venv/bin/python" -m pip install --disable-pip-version-check numpy==2.1.3 python-chess==1.999
      - name: Check runner invariants
        working-directory: /workspace/dwqww
        run: "$SHARD_ROOT/venv/bin/python -B tools/nnue/run_teacher_ci_shard.py --self-test"
      - name: Build, collect fresh complete games, label, and prepare one shard
        working-directory: /workspace/dwqww
        run: >-
          "$SHARD_ROOT/venv/bin/python" -B tools/nnue/run_teacher_ci_shard.py
          --stage run --shard ${{ matrix.shard }} --out "$SHARD_ROOT"
          --stop-at 2026-10-23T22:40:00Z
      - name: Preserve final or failed checkpoint
        if: always()
        working-directory: /workspace/dwqww
        run: python3 -B tools/nnue/run_teacher_ci_shard.py --stage finalize --shard ${{ matrix.shard }} --out "$SHARD_ROOT" --job-status "${{ job.status }}"
