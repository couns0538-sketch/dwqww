# Opus R14-B item 1: sanitizer self-test of the fast npt loader (forge_fastloader). Runs only on this branch.
name: ffl-sanitize
on:
  push:
    branches: [opus-r14b-fast-loader]
    paths:
      - 'opus_r14b/item1/fastloader/**'
      - '.github/workflows/ffl-sanitize.yml'
  workflow_dispatch:
jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            flags: -fsanitize=address,undefined -fno-sanitize-recover=all
          - name: tsan
            flags: -fsanitize=thread
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: g++ --version | head -1
      - name: build
        run: >
          g++ -std=gnu++20 -O1 -g -fno-omit-frame-pointer -pthread ${{ matrix.flags }}
          -o ffl_selftest opus_r14b/item1/fastloader/ffl_selftest.cpp opus_r14b/item1/fastloader/forge_fastloader.cpp
      - name: run
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          mkdir -p "$RUNNER_TEMP/ffl"
          timeout 900 ./ffl_selftest "$RUNNER_TEMP/ffl"
