#build_tag = "r6pgo"
#build_cmd = '"C:/Program Files/Git/bin/bash.exe" C:/nnue-lab/forge/tools/build_forge_r5_pgo.sh "{out_exe}" "{net}"'
#build_tag = "r5pgo"
#build_cmd = '"C:/Program Files/Git/bin/bash.exe" C:/nnue-lab/forge/tools/build_forge_r4s_pgo.sh "{out_exe}" "{net}"'
#build_tag = "r4spgo"
#build_cmd = '"C:/Program Files/Git/bin/bash.exe" C:/nnue-lab/forge/tools/build_forge_all_pgo.sh "{out_exe}" "{net}"'
#build_tag = "allpgo"
#build_cmd = '"C:/Program Files/Git/bin/bash.exe" C:/nnue-lab/forge/tools/build_forge_pgo.sh "{out_exe}" "{net}"'
#build_tag = "pgo"
# Changed 2026-11-14 22:17: MateAlphaGuard = true (Astra's guard: with a mate score as the lower bound, the two
# futility tests on the static evaluation do not prune, so a shorter mate is not missed). His acceptance and soak
# are complete (report at his commit 65e600e2): 120 of 120 exact rook endings sound with 1, 2 and 4 threads; on
# against off over 2,000 games 567-572-861 with 991 of 1,000 pairs level; 708 sanitizer games with it on and off
# without a fault. Takes effect when the config is next read (round 8, or a restart). Off again: remove the entry.
uci_options = { Threads = 1, Hash = 16, OwnBook = false, MateAlphaGuard = true }
# Search settings found by tuning are added from this file once it exists. It is written only after the tuned
# values have beaten the defaults in two matches (pipeline/tools/spsa_chain.py). Delete the file to switch them off.
tuned_options_file = "C:/nnue-lab/pipeline/forge_tuned_options.json"
# Set 2026-11-15 with the change to king-bucket nets: the tuned values of the file above were found with the
# round 2 net and are given ONLY to that net. King-bucket nets play at the engine's default settings (plus
# uci_options above), which is how the twin played in the two matches that made it the loop's best. So in the
# loop's matches candidate and best both run at default settings. When tuned values for the king-bucket nets
# exist AND have been tested on a second such net, they go into that file and this line goes out (or false).
tuned_only_for_tuned_net = true
# Search settings for every king-bucket net (set 2026-11-15 08:26, acts from the next round; read by
# `engine_for_net` in pipeline/nnloop/engine.py, so self-play, the loop's matches, the yardstick and every tool
# that asks there get them). These are the 13 "shape" values of the first tuning run plus NonPawnCorrection.
# Measured on nets they were NOT tuned with, same net on both sides, against the engine's defaults:
#   250,000 nodes: +11.0 +/- 9.7 (b_full, 2,000 games) and +8.9 +/- 8.5 (the twin, 2,000 games);
#   2,000 nodes, the depth of self-play: +79.2 +/- 7.5 (the twin, 6,000 games, 2927-1582-1491,
#   runs/forge/net_tests/exp_v3r8kd_shape_vs_default_2k_6000). So self-play games are played much better at
#   the same cost per position.
# The 15 eval-based margins stay at the engine's defaults: a tuning run for them on the twin was stopped at
# iteration 495 of 1,200 because no value had moved more than half a step (runs/forge/spsa/tune3_twin_margins).
# To go back to defaults: delete this table.
# 2026-11-15 15:52: the B4 search bundle (engine source forge/r9, forge/r9/R9_NOTE.txt): CuckooRep, HistRework 2,
# TtPruneV2, CorrHistV2. Same net and settings on both sides: +17.0 +/- 8.4 at 250,000 nodes (2,000 games),
# +21.2 +/- 7.1 at 2,000 nodes (6,000 games), +14.0 +/- 7.1 at 2,000 nodes on the round 11 net; at EQUAL TIME
# (231,000 nodes against r7's 250,000, the measured speed ratio 0.924): +10.60 +/- 8.60 (2,000 games, 524-463-1013, LOS 99.2 %).
# The exe is profiled with the four switches on. Back: config.forge.toml.before_b4_1552.
# 2026-11-24 21:51 (Opus): THE BIG TUNE stage 4, the 40 values of A_FINAL.json (the long run big_r15dsp_r33_n20k, addendum 21; stage 3: every match
# holds, tmp/opus_scratch/bigtune/STAGE3.txt). Back: config.forge.toml.before_bigtune_2151.
v3_uci_options = { LmrQuietBase = 132, LmrQuietDivisor = 176, LmrNoisyBase = 25, LmrNoisyDivisor = 336, LmrHistoryDivisor = 6721, NullMoveBase = 5, LmpBase = 13, HistoryPruneMultiplier = 1945, HistoryBonusQuadratic = 49, HistoryBonusLinear = 90, HistoryBonusMax = 2429, SingularDepth = 6, IirDepth = 5, NonPawnCorrection = true, CuckooRep = true, HistRework = 2, TtPruneV2 = true, CorrHistV2 = true, DrawJitter = 2, NullMoveMinDepth = 2, NullMoveDepthDivisor = 4, NullMoveEvalDivisor = 184, RfpDepth = 6, RfpMargin = 84, RfpImproving = 37, RazorDepth = 3, RazorBase = 182, RazorMultiplier = 379, FutilityDepth = 8, FutilityBase = 12, FutilityMultiplier = 59, HistoryPruneDepth = 2, SeeQuietMultiplier = 15, SeeNoisyMultiplier = 83, SingularMargin = 3, ProbcutDepth = 7, ProbcutMargin = 168, QsFutilityMargin = 123, AspirationDelta = 16, CheckExtensionDepth = 3, LmrCutoffThreshold = 9, MaterialCorrectionWeight = 48, CaptureFutilityBase = 45, FailLowContinuationBonus = 41, EvalSwingMult = 15 }

[engine.score]
unit = "raw"                     # Forge prints plain centipawns from the side to move
multiplier = 1.0

# ---------------------------------------------------------------- data generation
[datagen]
# 2026-11-20 11:00 (Opus): the game loop inside the engine, tmp/opus_scratch/selfgame_pc/PLACE_PLAN.txt; back: selfgame = false
selfgame = true
backend_round1 = ""              # no bootstrap round: the lock net already exists
backend  = "uci_selfplay"
early_selfplay = true            # 2026-11-17 Opus: round r + 1's self-play runs while the card trains round r (datagen_uci.EarlySelfplay, after the trainer's data ready line); false = as before
# 16 = one worker per CPU thread. Since 2026-11-15 07:30 (from round 11 on) the number that actually PLAYS is set
# by the loop itself (share_cpu below): it measures every 30 seconds how many threads other programs are using
# (a match, a tuning run, anything you start) and lets only as many workers play as there is room for, never
# fewer than 4; when the other programs end, all 16 play again. Tested on 2026-11-15: beside jobs using 13 to 14
# threads a test run went from 10 workers to its minimum within ten seconds. Before, this number was set by hand
# to 4 for the hours of a tuning run and back afterwards (round 10 still runs with 4).
# The heat guard ([limits]) works on top of it: the smaller of the two limits holds.
workers  = 16
share_cpu = true                 # false = always all `workers` (as before)
share_min_workers = 4
share_check_seconds = 30
share_reserve_threads = 8         # 2026-11-18 Opus, the big tune (owner 17 Nov: "the tune is the first user after the loop's own gate and
                                  # yardstick matches: up to 8 games at once. Self-play takes what is left"): while a process matching
                                  # share_reserve_pattern is alive, 8 threads count as used by others, also while it waits for heat
                                  # (datagen_uci.CpuShare._reserved); 0 = off. Test tmp/opus_scratch/reserve/test_reserve.py
share_reserve_pattern = 'spsa_tune(_flipped)?\.py (big_r15dsp_r33_n20k|bigtune_ctl_pos|bigtune_ctl_flip)( |$)'
# 2026-11-18 addendum 7 of the big tune: while that run is alive, self-play takes workers off from 89 C (2 under
# the tuner's own 91 C pause) and adds one back at 87 C or cooler; its full pause stays at cpu_temp_pause_c.
share_reserve_heat_c = 89
# 5,000 nodes per move and 16 million positions per round, as in rounds 4 to 6. Between 18:15 and 20:10 on
# 2026-11-14 this was set to 20,000 nodes and 4 million positions for round 7, as a test of deeper labels; no
# round ran with it. Taken back at 20:10, because that evening a net WITHOUT the hand-written evaluation
# ("stand-alone", EXPERIMENTS.md) came out level with the loop's net at equal time, and its hold-out loss
# still falls with every doubling of the data (14, 28, 55 million positions). Such a net is trained from
# nothing, so the number of positions is what it needs most. The deeper-label test is parked, not refuted.
nodes    = 5000
# soft_nodes (set 2026-11-14 23:05, during round 7's self-play): the labelled searches ask the engine with
# `go softnodes 2000` instead of `go nodes 5000`. The engine then stops after the first FINISHED search depth that
# has used at least 2,000 nodes (hard cap 8,000), instead of being cut off at 5,000 in the middle of a depth. With
# the fixed limit the move and the score both came from the last finished depth and the work after it was thrown
# away. Measured inside real self-play games (pipeline/tools/selfplay_limit_compare.py, 30 games each, one worker):
#     go nodes 5000      2.638 ms per move, labels from depth 8.44 on average (3,004 nodes)
#     go softnodes 1500  1.839 ms,          depth 7.84
#     go softnodes 2000  2.143 ms,          depth 8.56 (3,517 nodes)     <- chosen: 23 % more positions per second
#     go softnodes 2500  2.567 ms,          depth 8.94                      and labels a little deeper than before
# Checked on 1,500 positions (pipeline/tools/softnodes_check.py): the move is always the last finished depth's.
# `nodes` above is still used for the random opening moves. 0 or no line = the old fixed limit.
soft_nodes = 2000
positions_round1 = 3000000       # about 12 minutes at 4,100 positions/s (16 workers, CPU otherwise free)
positions        = 16000000      # from round 4 (set 05:05); 8000000 in round 3, 5000000 in round 2.
#positions       = 8000000       # from round 3 (set 04:09, before round 3 started); was 5000000 in round 2.
                                 # Forge now has the PC to itself, the match is the long part of a round, and more
                                 # new data per round is the lever that has worked so far (about 26 minutes of self-play)
val_positions    = 100000
chunk_positions  = 500000
seed = 1
book = ""                        # standard start position, as in your own self-play script (tools/nnue/forge_selfplay.py)
