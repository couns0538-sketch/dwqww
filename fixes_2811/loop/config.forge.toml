# ---------------------------------------------------------------- training
# Since 2026-11-15 (round 10): the loop trains KING-BUCKET nets (file format FORGENN3, ".fnn3"; trainer
# pipeline/forge_train_v3.py; engine source forge/r7). Such a net stands alone (no hand-written evaluation), is 512
# wide with 8 mirrored king buckets and 8 output blocks, and is trained FROM NOTHING in every round on all rounds
# so far, with the recipe of the net that won the engine match of that morning (the "twin", Opus's experiment
# v3_h512_r1to8_e40_kd): 40 passes, rate 0.0005 in four cosine cycles ending at 15/30/60/100 % of the passes,
# batch 8192, decay 0.3 on the king-bucketed weights, targets 0.75 score + 0.25 result, captures kept, and a
# teacher: the best residual net (b_full, copied to runs/forge/teachers/b_full.pt) at weight 0.2.
# About 35 minutes for 96 million positions on the RX 7900 XT.
# The lines of the residual-net recipe used until round 9 are kept below as comments; to go back, swap them in
# and make a residual net (.inc) the best net in runs/forge/state.json.
[train]
backend = "command"
net_suffix   = ".fnn3"
model_suffix = ".pt"
# --teacher-once (added 2026-11-15 07:50, from the Opus session): the teacher net's value of every position is
# computed once before the training instead of for every batch. The same numbers (checked: losses equal to the
# 4th digit, which is what two runs of the old way differ by; engine-against-trainer check PASS), 25 % faster.
# 2026-11-20 15:13 (Fable's unplace_td.py): the TD-label trial (PLAN-2011-TD-LABELS) was switched off here.
train_cmd  = '"{python}" C:/nnue-lab/pipeline/forge_train_v3.py train --datasets {datasets} --val "{val}" --out-model "{model}" --hce-exe C:/nnue-lab/forge/build/hce_dump.exe --epochs {epochs} --lr {lr} --batch-size {batch_size} --keep-noisy --lr-cycles auto --w1-decay 0.3 --mix 0.75 --distill-net C:/nnue-lab/runs/forge/teachers/b_full.pt --distill-weight 0.2 --teacher-once --hidden 768'
batch_size = 8192                # {batch_size} above
export_cmd = '"{python}" C:/nnue-lab/pipeline/forge_train_v3.py export --model "{model}" --net "{net}"'
auto_epochs = false
max_epochs  = 40                 # passes over the window ({epochs} above); 2026-11-17 13:35 Opus: back to 40 by the revert rule of 07:48 (rounds 32, 33, 34 at 60 not adopted: +6.43, +7.21, -0.69; round 35 still trains with 60, the fourth; if it is adopted 60 comes back from round 37); back: 60
epoch_size  = 0
lr          = 0.0005
lr_continue = 0.0005
init        = "scratch"          # every round's net is trained from nothing ("best" = continue the best net's model)
window_rounds   = 1000            # all rounds
# The window is held on the graphics card, about 90 bytes a position: 96 million positions (rounds 1 to 9) take
# 8.5 GB of its 20 GB. When the window would hold more than this many positions, the oldest rounds are left out
# (pipeline/run.py; the round's note says which). Reached at about round 17.
# 2026-11-15 22:21: 200,000,000 -> 160,000,000, as a MEMORY GUARD, not a recipe decision. Round 14's training
# (165.8 million positions) took the PC to its commit limit: the trainer held 34.5 GB of commit and 23.6 GB of
# main memory, 0.4 GB of commit and 2.5 GB of memory were free, and the Opus session's background jobs were
# closed for low memory. Round 15 would have been 1.2 GB larger. With 160 million the window of round 15 is
# about 152 million (rounds 1 to 4 are left out), the size of round 13, which trained with room.
# It goes up again when the positions lie on the card in the compact record (46 bytes instead of 88).
# 2026-11-16 01:23: 160,000,000 -> 185,000,000 (acts from round 17). THE GUARD OF 22:21 HAD STOPPED THE LOOP'S GAINS:
# this number counts positions KEPT BY THE FILTER; the trainer uses 91 % of them. With 160 million the candidates of
# rounds 14, 15 and 16 were trained on 10 rounds = 138 million positions, while the best net (round 13) was trained
# on 13 rounds = 152 million: less data than the net they had to beat, and none was promoted (-0.6, -3.5, about 0;
# rounds 10 to 13, each with one round MORE than its opponent, gained about +10 each). The reason for the guard is
# gone: the memory of 22:21 was the trainer's leak, repaired 22:28 (rounds 15 and 16: main memory flat at 1.4 GB
# through all 40 passes). 185 million = 12 rounds = about 166 million positions used. CARD MEMORY, from the owner's
# HWiNFO log (column "GPU D3D Memory Dedicated"): 14.39 GiB during the trainings of rounds 15 and 16 (138.2 million
# used; 0.49 GiB of it is the desktop's, 0.34 GiB "dynamic" = hardly any spill). That is 92 bytes a used position +
# about 2 GiB. So: 12 rounds about 16.7 GiB, 13 rounds (cap 200,000,000) about 17.9 GiB, 14 rounds about 19.1 GiB,
# all 17 rounds over the card's 20. A window of 165.8 million has run on the card before (round 14's first
# training, 37 passes; it ended from the leak in MAIN memory, not from the card).
# Next step up: 200,000,000 only after a training at 185 has been watched in that log; all rounds need the compact
# record of the new trainer (44 bytes a position).
# 2026-11-16 03:30 (acts from round 18): 360,000,000 = ALL rounds again, as in rounds 10 to 13. Possible because
# the trainer keeps the window on the card as the compact record now ([train] env FORGE_COMPACT=1, placed 03:29
# after the night's card session: 44 kernel-test runs, the NaN repair proven, 2 passes on all 17 rounds, and 40
# passes on the same 12 rounds as round 17: hold-out 0.008807 against the old trainer's 0.008795).
# Card memory measured: 9.61 GiB at 181.5 M kept, 11.34 GiB at 227.0 M kept = 40.8 bytes a kept position. So
# 360 M kept = about 16.4 GiB of the card's 20 and 22 minutes for 40 passes; all rounds fit until round 25.
# LOOK AT THIS NUMBER AGAIN AT ROUND 22 (about 303 M kept, predicted 14.2 GiB): compare the prediction with the
# owner's HWiNFO log before the window is allowed to grow further.
# If the compact record is ever refused (train.log: "COMPACT RECORD: could not be used"), the wide record does
# not fit a window this large and the trainer STOPS with "WIDE RECORD: it does not fit" (on purpose: no spill).
# Then: max_window_positions = 185000000 and env = { FORGE_FUSED_STEP = "1" } give the old state back
# (config.forge.toml.before_env_0329; the old trainer file is pipeline/forge_train_v3.py.prev_next_0329).
# 2026-11-17 20:50 (Opus): 380 M from round 41 (rounds 17 to 41 instead of 19 to 41, +8.7 %): the window was at its
# 360 M cap since about round 28, so every candidate had as much data as the best net; the card peaked at 15.76 to
# 16.44 GiB at 318.6 M used, 380 M is about 17.2 to 17.8. Declaration with predictions and revert rules:
# tmp/opus_scratch/window380/DECLARATION.txt. Back: config.forge.toml.before_window380_2050 (360000000).
# 2026-11-20 03:48 (Fable; acts from round 80): 388 M, so that the window STAYS at the newest 25 rounds. Since round
# 68 a round keeps 15.25 M positions instead of 15.12 M (round 67's net plays); the newest 25 rounds held 379.59 M at
# round 79 (405,033 under the cap), would hold about 379.98 M at round 82 (about 22,000 under it: a coin flip for the
# fourth round of the TD trial) and from round 83 the cap would have cut the window to 24 rounds (365 M kept, 3.9 %
# less than the best net's window; the loop's WARNING). 388 M = 25 rounds up to 15.52 M kept each, never 26 (those
# hold 394.7 M). Card: 17.04 GiB at 346.98 M used rows (round 78); 25 rounds of 15.25 M kept are about 348.8 M used,
# about +0.1 GiB. Back: the line below to 380000000 (a text edit; the file before, for reading only:
# config.forge.toml.before_window388_0347). Marker PLAN-2011-WINDOW-388.
max_window_positions = 388000000
# Until round 9 (residual nets, continued from the best net with a small rate):
#net_suffix   = ".inc"
#train_cmd  = '"{python}" C:/nnue-lab/pipeline/forge_train.py train --datasets {datasets} --val "{val}" --init-model "{init}" --init-net "{init_net}" --out-model "{model}" --hce-exe C:/nnue-lab/forge/build/hce_dump.exe --epochs {epochs} --lr {lr} --batch-size {batch_size}'
#batch_size = 4096                # (a setting since 2026-11-14 23:22; 16384 for a net trained from nothing)
#export_cmd = '"{python}" C:/nnue-lab/pipeline/forge_train.py export --model "{model}" --net "{net}"'
#max_epochs  = 4                  # from round 2 (was 2 in round 1)
#lr          = 0.00005            # from round 2 (was 0.00002 in round 1): small, the lock net is only fine-tuned
#lr_continue = 0.00005
#init        = "best"
#window_rounds   = 8               # train on the last 8 rounds (10 until 2026-11-14 18:10; 1000 = all before 05:25). The positions are
                                  # joined in RAM (about 77 bytes each, twice for a moment) and then held on the GPU. With keep_noisy
                                  # a round of 16 million gives about 13.8 million training positions (11.1 million before), so
                                  # 8 rounds are about 8.5 GB of the GPU's 20 GB and 17 GB of RAM for a moment, as 10 rounds were.
# keep_noisy (set 2026-11-14 18:10, from round 7): the trainer also learns from positions whose best move is a capture
# or a promotion (positions in check stay out). Why: the Opus session's experiment "arm b" (EXPERIMENTS.md): the same
# recipe on the same number of positions gave a net +15.4 +/- 5.9 Elo stronger over 6,000 games at 50,000 nodes.
# The hold-out loss gets WORSE with it (the hold-out is quiet positions only); that loss does not track strength here.
# Every candidate still has to pass both matches. false = the old rule (quiet positions only).
keep_noisy = true
# ft_backend (set 2026-11-14 22:35, from round 7's training): "triton" = the first layer of the net is computed by
# two small GPU programs written here (pipeline/ft_triton/ft_kernels.py, compiled by the official triton-windows
# package in tools/triton38) instead of a 768-wide matrix product. Measured with this recipe on round 1 (256 wide,
# batch 4,096, starting from the best net, two passes): 1.43 to 1.54 million positions per second against 0.51
# million, the same LOSS (0.013260, 0.017237) and hold-out loss (0.014726) to six digits; of the 197,398 numbers
# in the exported net 120 differ, each by one step. At 512 wide and batch 16,384: 1.7 to 1.9 million against
# 0.43 million. Before every training the trainer compares the kernels with the old path on 512 positions and
# uses the old path if they disagree or do not load, so a training cannot fail because of this.
# Back to the old path: remove this line or write "dense".
ft_backend = "triton"
validation_size = 1              # > 0 switches the hold-out set on
# The step to a 512-wide net (set 10:20 on 2026-11-14; the owner's OK of that day: "only if you think we got
# enough positions"). When the training window holds widen_min_positions kept positions, the candidate of that
# round is the best net widened to widen_to hidden units (it computes exactly the same at first) and trained
# with widen_epochs and widen_lr. Because a wider net is slower per node, its match and its confirmation are
# played on the clock (sprt.tc, at most sprt.max_games_clock games), not at fixed nodes. It is tried at most
# widen_max_attempts times; if a wide net is promoted and confirmed, all later nets are 512 wide.
# Tested on a tiny copy of this profile (runs/forge_wtest) before it was switched on. widen_to = 0 switches it off.
widen_to = 512                   # does nothing while the best net is a king-bucket net (.fnn3)
widen_min_positions = 120000000  # kept positions in the window, about 85 million quiet ones; reached at round 10
widen_epochs = 8
widen_lr = 0.0001
widen_max_attempts = 3
# FORGE_FUSED_STEP = "1" (2026-11-15 21:34, acts from round 15): the king-bucket trainer does its step with three
# Triton kernels more (pipeline/ft_triton: batch_kernel.py = gathers + target + index rows + output bucket in one
# launch; dense_kernels.py = dense end + loss + their backward in two). Before every training it runs ONE batch
# the old way and the new way and uses the new one only if loss and gradients agree (train.log: "FUSED STEP:
# ... USED"); otherwise it trains the old way by itself. Measured: 4.6 -> 5.7 M positions a second on the real
# data (Opus's check: loss equal to 7.7e-8, gradients to 5.8e-7), same losses and hold-outs to run-to-run noise.
# Back to the old step: env = {}. The trainer file before the switch existed: forge_train_v3.py.prev_fused_2130.
env = { FORGE_COMPACT = "1", FORGE_STEP_V2 = "1", FORGE_TRITON2_BLOCK = "512", FORGE_TRITON2_KC = "32", FORGE_TRITON2_BBLOCK = "256", FORGE_TRITON2_BKC = "16", FORGE_TRITON2_WARPS = "4", FORGE_TRITON2_LPOS = "16", FORGE_DENSE_GW_R = "128", FORGE_DENSE_GW_BC = "128", FORGE_DENSE_GW_WARPS = "8", FORGE_DENSE_FWD_WARPS = "1", FORGE_FUSED_STEP = "1", FORGE_PARSE_PROCS = "4" }

# ---------------------------------------------------------------- SPRT
[sprt]
fastchess   = "C:/nnue-lab/tools/fastchess/fastchess-windows-x86-64/fastchess.exe"
book        = "C:/nnue-lab/tools/book/UHO_Lichess_4852_v1.epd"
book_format = "epd"
# Settings follow your own Forge match notes: Threads 1, Hash 16, OwnBook false, UHO book,
# 12 games at once, time margin 1000 ms, 6 s + 0.06 s, no adjudication, -recover.
tc          = "6+0.06"
timemargin_ms = 1000
concurrency = 12
elo0 = 0.0
elo1 = 10.0
alpha = 0.05
beta  = 0.05
model = "normalized"
# From round 4 (set 05:17, before round 4 started): the first match of a round is played at a fixed
# 50,000 nodes per move instead of the 6+0.06 clock. Reason: this match is only the first filter, and at
# the clock it took 16 to 22 minutes for 600 to 800 games (up to 55 minutes at the cap), which is time the
# CPU does not make data. At 50,000 nodes about 1,000 games take 4 to 5 minutes, and the result does not
# depend on machine load. A net that passes must still win the confirmation match below at 250,000 nodes
# (your second standard setting) before it is used. Rounds 1 to 3 used tc 6+0.06 with a cap of 800 / 2000 games.
nodes       = 50000               # 0 = play on the clock `tc` instead
max_games   = 4000                # cap of the first match (was 2000 on the clock)
# default_settings (set 2026-11-15 01:05, from round 8's match): the loop's matches between two nets (the first
# match and the confirmation) are played with the engine's DEFAULT search settings; the 29 tuned values are left
# out for both sides. Self-play keeps them. Why: the tuned values were found on 2026-11-14 by self-play of the
# round 2 net, and they turned out to fit that net rather than the engine. Same two nets, 2,000 games each at
# 50,000 nodes: at default settings b_full (the loop's recipe with captures kept) beat the round 2 net by
# +29.2 +/- 10.3 (Opus); with the tuned values on both sides the result was level (runs/forge/net_tests/
# bfull_vs_r0002_tuned). So a match with the tuned values tested every candidate with settings fitted to its
# opponent; round 7's candidate (+3.5 +/- 7.2) met that. false or no line = the tuned values in the matches too.
#
# Taken back at 01:55 the same night (false from the next start of the loop). What the default-settings match did:
# it promoted round 8's net (+13.6 +/- 9.4 at 50,000 nodes, default against default), and then two matches showed
# that this was the wrong question for the loop: (1) the same pair at 250,000 nodes, default settings, stood at
# -14.5 +/- 16.0 after 720 games (the gain of the capture rule fades at deeper search); (2) as complete engines the
# round 2 net WITH its tuned values led the round 8 net at default settings by 33 +/- 15 after 1,004 games. The
# loop's best must be the strongest ENGINE (net plus settings), because it makes the training positions and is
# what the owner plays. So with false the match is "each net with its best-known settings" (engine_for_net gives
# the tuned values only to the net they were tuned with): a candidate at default settings must beat the best net
# with its own tuned values. That is hard to pass, fails fast when it fails, and never puts a weaker engine in
# charge. A new net needs its own tuning run before it can take over; default-against-default comparisons of
# nets belong to the experiments (Opus's series), not to the loop's gate.
default_settings = false
max_games_clock = 2000            # cap when a match has to be played on the clock (a net of another width)
max_minutes = 150                 # was 80; a 2,000-game confirmation or clock match must fit even when the CPU is shared
ratinginterval = 20
resign_score = 0                 # 0 = no resign adjudication
draw_movenumber = 0              # 0 = no draw adjudication
maxmoves = 0
extra_args = []
# A net that passes the SPRT must also win a second, independent match before it is used further.
# It is played at the start of the next Forge round: fixed length, other seed, fixed nodes per move
# (the second standard setting of your own match scripts), so it does not repeat the first test.
# Changed at 10:27 on 2026-11-14, while round 6's first match was still being played (so before its result
# and before any confirmation it could lead to): 2,000 games and 90% instead of 1,000 games and 95%.
# Reason: 1,000 games resolve only +/- 11.6 Elo. A net that is truly 10 Elo better then reaches 95% in about
# half of all confirmations, so real gains of the size this loop makes were thrown away (round 5: +8.7 +/- 11.6,
# 92.8%, rejected). With 2,000 games (+/- 8.3) and 90% a truly +10 net passes about 6 times in 7; a net that
# is truly equal passes 1 time in 10, and it must have passed the first match before, so both together
# let a no-better net through about 1 time in 200. Cost: about 40 minutes instead of 20 per promoted net.
confirm_games   = 2000
confirm_nodes   = 250000            # nodes per move, no clock
# Since 2026-11-15 17:16 (Opus's rule C08, his jobs 4 and 10; read and placed by Fable): the confirmation match is an
# SPRT (normalized Elo 0 against 17.2, alpha 0.08, beta 0.14) with confirm_games as its cap; H1 = confirmed, H0 = failed,
# and when no bound is crossed at the cap the LOS rule below decides as before. Tested: replay of 36 real matches (no
# verdict changed), 10,000 simulated matches (false pass 10.6 % against 9.8 %, pass at +10 Elo 78.9 % against 80.5 %,
# about 1,100 to 1,250 games instead of 2,000), one real round in shadow (round 13: it would have stopped after 219
# games with the same FAIL), and a live planted pair (the same net twice: H0 after 774 games; a clearly stronger net:
# H1 after 214). Bounds can be changed with confirm_sprt_elo0 / _elo1 / _alpha / _beta. false or no line = 2,000 games.
confirm_sprt = true
confirm_min_los = 90.0              # likelihood of superiority needed, in percent
# Since 2026-11-20 16:06 (Opus, job 1 (c) of FOR_THE_USER/opus 24h.txt; acts from round 88): the POOLED GATE. When a
# round's gate does not promote, the pentanomials of the last pooled_gate_k gates against the SAME best net (same time
# control, never past an earlier pooled promotion) are pooled; if the pool's 95 % lower bound is above 0 Elo and the
# round's own gate is at or above pooled_gate_min_own (default 0), the candidate is promoted and the confirmation
# above decides as always. Why: candidates were +3.5 better for 8 and 28 rounds while single gates (+/- 6.5) missed
# it (tmp/opus_scratch/opus24h/JOB1A_TABLE.txt). Declaration with replay and revert rule:
# tmp/opus_scratch/opus24h/DECLARATION_1c_pooled_gate.txt. 0 = off (a text edit of this line).
pooled_gate_k = 8

# ---------------------------------------------------------------- outside yardstick (added 04:57, used from round 4)
# Each confirmed best net, and once the lock net, plays one fixed-length match against official Stockfish
# held to a set strength. It answers "where does Forge stand against a 3100 mark" on this PC at this clock.
# It is a yardstick, not a rating (Stockfish's scale was calibrated at a much longer clock) and not a gate:
# nothing is promoted or rejected by it. Set enabled = false to switch it off.
[anchor]
enabled = true
# Owner, 2026-11-15 08:50 (in Opus's window): "it needs to be paired against stockfish 19 ... just do uci limit
# strength to 3100". So since 08:55 the reference is the official RELEASE Stockfish 19 (tag sf_19, built here with
# its official net nn-1a298aa575a0.nnue; bench 2497913 as its release notes say), held to UCI_Elo 3100.
# Until then it was the development version of 2026-11-10 at the same setting (name "sf_elo3100"): the lock net
# +11.3 +/- 23.9, the round 2 net +15.7 +/- 25.3 (with its tuned values +19.1 +/- 28.0).
name = "sf19_elo3100"
cmd  = "C:/nnue-lab/src/sf_old/sf_19/src/stockfish.exe"    # official Stockfish 19 (edb0d9db, 2026-09-05), built here
uci_options = { Threads = 1, Hash = 16, UCI_LimitStrength = true, UCI_Elo = 3100 }
games = 400                      # about 11 minutes at 6+0.06 with 12 games at once
tc = "6+0.06"
include_initial = false          # was true: the lock net was measured once against the first reference (+11.3 +/- 23.9);
                                 # not repeated against Stockfish 19 (12 minutes of the loop for an old net)
max_minutes = 40
# Since 2026-11-15 08:03 this match is only played when the PC has room for it, because on the clock an engine
# that has to share its processor thread plays weaker and the figure is worth nothing. Before the start the loop
# measures for 10 s how many threads other programs use. With room it plays fewer games at once (the same share
# of the free threads as 12 of 16; max_minutes grows in proportion). With fewer than min_concurrency + 1 free
# threads, or a CPU that stays above heat_add_worker_c for cool_wait_seconds, the match is put off: the end of
# the next round tries again. share_cpu = false gives the old behaviour (always 12 at once).
share_cpu = true
min_concurrency = 4
cool_wait_seconds = 600
# Two files for working beside the Opus session (2026-11-15 09:20). busy_files: while one of them exists (his
# trainings on the graphics card hold tmp/exp_gpu.lock), a clock match waits, at most busy_wait_seconds, and is
# put off if the file is still there. running_marker: this file exists exactly while a clock match plays; he
# starts nothing on the card or the CPU while it is there.
busy_files = ["C:/nnue-lab/tmp/exp_gpu.lock"]
busy_wait_seconds = 1800
running_marker = "C:/nnue-lab/teamwork/CLOCK_MATCH_RUNNING"
# Strength matches owed for the best confirmed net are played at the START of a round (after a confirmation
# match, before self-play) and again looked at at its end. at_round_start = false: only at the end.
at_round_start = true

# ---------------------------------------------------------------- rated references (added 2026-11-15 08:50)
# Old official Stockfish releases are fixed programs with a published rating (CCRL 40/15 list of 13 November 2026,
# single CPU: Stockfish 3 3129, 4 3155, 5 3238, 6 3280, 7 3302, 8 3358, 9 3422, 10 3443, 11 3494). Built here from
# the official repository's tags into src/sf_old (each build prints the bench signature of its release).
# The best confirmed net plays each reference below once, under the yardstick's rules (same clock; only when the
# PC has room and is cool; put off to the next round otherwise; stopped and replayed with fewer games if it gets
# hot). Missing keys are taken from [anchor]. By hand: pipeline/tools/rated_match.py <sf3..sf11> [games].
# READ WITH CARE: "published rating + our difference" is an estimate on that list's scale, not a rating: their
# clock is far longer and their openings differ. First look, 2026-11-15: the twin against Stockfish 4 (3155) at
# 6+0.06: 172-6-22 in 200 games, +413 +/- 69. enabled = false switches one off.
# Results for round 10's net (2026-11-15, 10:14 and 10:24): Stockfish 8 177-45-78 (+164 +/- 32), Stockfish 10
# 137-67-96 (+83 +/- 29). Stockfish 8 is too weak to bracket Forge now (72 % score), so from the next best net on
# the two references are Stockfish 10 and Stockfish 11.
[[anchor_extra]]
name = "stockfish11_ccrl3494"
cmd  = "C:/nnue-lab/src/sf_old/sf_11/src/stockfish.exe"
uci_options = { Threads = 1, Hash = 16, Ponder = false }
rating = 3494
rating_source = "CCRL 40/15, list of 2026-11-13, single CPU"
games = 300
enabled = true
# every_rounds = 2 (2026-11-15 15:30): played only in even rounds (saves about 19 minutes in the others)
every_rounds = 2

