# 2026-11-17 10:43 (Opus): engine source forge/r15c (forge/r15c/R15C_NOTE.txt) = forge/r15 + the helper
# carbon2's speed patch, read line by line: the same nodes on 1,200 of 1,200 positions (768 and 512 nets), the same
