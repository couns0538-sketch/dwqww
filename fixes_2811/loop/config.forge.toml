v3_build_cmd = '"C:/Program Files/Git/bin/bash.exe" C:/nnue-lab/forge/tools/build_forge_v3r15dsg_sp_clang_pgo.sh "{out_exe}" "{net}"'
v3_build_tag = "r15dsg-sp-clang"
