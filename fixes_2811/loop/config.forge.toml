# Engine profile for Forge (lock combo29, source verified against its hash manifest).
# Run:  C:\nnue-lab\pipeline\run.cmd --config C:\nnue-lab\pipeline\config.forge.toml
# Same loop as config.toml; only the engine, data and trainer blocks differ.

[paths]
root   = "C:/nnue-lab"
runs   = "C:/nnue-lab/runs/forge"
python = "C:/nnue-lab/venv101/Scripts/python.exe"
report = "C:/nnue-lab/REPORT.md"
tmp    = "C:/nnue-lab/tmp"

[limits]
min_free_gb = 40
# Disk relief (2026-11-15, the owner: "when selfplay gets too large for disk space filter the positions that frees
# space"). A round takes about 2.5 GB. When free space falls under relief_below_gb, rounds that are NO LONGER in
# the training window (see [train] max_window_positions) lose their training cache (rebuildable) and get their
# positions file packed to a fifth of its size (filtered.plain.gz; unpack with any gzip tool; no position is
# lost). Oldest first, only until the space is back. Rounds in the window are never touched. 0 = off.
# The Opus session's experiments read old rounds directly: he is told before this ever acts (it cannot before
# about round 14, when the window is full, and not before the disk is down to 60 GB, weeks away at 172 GB free).
relief_below_gb = 60
# Step 3 (owner, 2026-11-16 about 18:05: "you are allowed to write the self play data if disk space gets right to
# other disks once all disks are at 30gb thats the stop"; 18:10: build it). When C: is STILL under
# overflow_below_gb after the packing above, the packed positions file of a round outside the window is moved to
# the lab's own folder on D: or F: (made once, with a marker file; a folder of that name without the marker is never
# used; nothing else on those disks is touched), copied, compared byte for byte, a pointer file left in its place.
# No other disk is taken below overflow_floor_gb (never under 30 in the code). E: (3 GB stick) is never used.
# Remove overflow_dirs (or set overflow_below_gb = 0) to switch it off. Code: pipeline/nnloop/diskrelief.py.
# Owner, 2026-11-20 about 17:09: "you have the right to use one folder on each drive till each drive hits 30gb", and he
# made the two folders himself (exact names, the F: one has TWO spaces); Opus wrote the marker into each at 17:12:00.
overflow_dirs = ["D:/nnue folder2", "F:/nnuelabs  3"]
overflow_below_gb = 50
overflow_floor_gb = 30
deadline    = ""                 # no end time (set 05:05 on 2026-11-14; was "2026-11-14 09:15"). The owner wants the loop to
                                 # keep making data. It runs until STOP_LOOP.cmd (in the nnue-lab folder) is used
                                 # or the disk limit is reached.
max_rounds  = 0
# Heat guard (set 06:15 on 2026-11-14). Self-play pauses when the CPU temperature in HWiNFO's log
# (hwinfo.CSV in the nnue-lab folder) stays at or above cpu_temp_pause_c for 6 checks 20 s apart, and goes on
# when it is back at cpu_temp_resume_c. Without a fresh log it watches the CPU's speed instead.
# The trainer has its own guard for the graphics card (100 C on its hottest sensor).
heat_guard = true
cpu_temp_pause_c  = 92
# Resume at 88 instead of 80 (changed 2026-11-14 21:50, after the guard fired for real for the first time): with
# the graphics card training beside it, the CPU sits at about 89 C even while self-play is paused, so with 80 the
# pause lasted the full 20 minutes each time. The pause limit (92) is unchanged. With the graphics card idle the
# CPU stays near 80 C at full load and the guard does not fire at all.
cpu_temp_resume_c = 88
# Fewer workers before a full pause (2026-11-14 22:42, `HeatGuard` in pipeline/nnloop/datagen_uci.py). Between
# 22:06 and 22:36 the guard cycled 2 minutes of play and 3 minutes of pause: self-play ran 40 % of the time
# (1,632 positions a second over the half hour) and the CPU swung between 86 and 94 C every five minutes. Now, at
# 92 C or more on two checks in a row, 2 of the 16 workers stop playing (down to heat_min_workers at the least);
# at heat_add_worker_c or less on two checks in a row one comes back. The 92 C limit is the same; the CPU is held
# just under it and self-play does not stop. The full pause stays as the last step (when 4 workers are still too
# hot). Tested with pretended temperatures (pipeline/tools/test_heat_guard.py, both scenarios PASS).
# heat_throttle = false gives the old behaviour.
heat_throttle = true
heat_min_workers = 4
heat_add_worker_c = 90
# Matches obey the same limit since 2026-11-15 08:03 (`pipeline/nnloop/heat.py`; before, only self-play and the
# tuner did, and match games beside a training on the graphics card held the CPU at 92 to 94 C for 28 minutes).
# A match at fixed nodes is not paused: at cpu_temp_pause_c on two checks 20 s apart, fastchess and its engines
# may use 2 processor threads fewer (one core), down to match_min_cpus; at heat_add_worker_c or cooler they get
# 2 back. The games go on and, at fixed nodes, are the same games (tested: a 160-game match squeezed to 2 threads
# was identical move for move, `pipeline/tools/test_match_heat.py logic procs match`). The time lost is added to
# the match's time limit. A match on the clock (the yardstick, see [anchor]) is never squeezed.
# Defaults, written here so they can be changed: match_heat_guard = true, match_min_cpus = 4 (heat_min_workers),
# match_cpu_step = 2, match_heat_check_seconds = 20.
match_heat_guard = true
max_consecutive_failures = 3
keep_checkpoints = false
keep_models = false

# ---------------------------------------------------------------- the engine
[engine]
name = "forge"
mode = "build_per_net"           # Forge has its net compiled in: every net gets its own exe
cmd  = "C:/nnue-lab/forge/build/forge_lock.exe"          # the lock build (used when no net is given)
initial_net = "C:/nnue-lab/forge/lock/src/nnue_weights.inc"   # the lock net (AL1 s198) is the first "best"
built_exe_name = "forge.exe"
# builds an exe for {net} from the verified lock source with the portable GCC.
# From round 3 (set 04:07): PGO + LTO build. Same node counts as the plain build for the lock net and
# the round 2 net (bench 13: 862329 and 722569), 1.8 to 2.0 % faster (bench 15, 7 interleaved runs).
# build_tag is part of the engine cache folder, so every net is rebuilt this way and no match mixes build types.
# Plain build: forge/tools/build_forge.sh with build_tag = "".
# From round 7 (set 10:00 on 2026-11-14, with the owner's OK of that morning): the engine is built from
# C:/nnue-lab/forge/t21, the source of carbon/t21-integrate-round2 (the lock plus the reviewed fixes of the
# cloud agents: capture-list overflow, clock parsing, node-limit move/score, net-file loader, start-up race,
# option messages, eval command, MultiPV, uci_loop). Exact-byte export, hash list forge/t21/SOURCE_INPUTS.sha256.
# Checked here before the switch: bench 11 / 13 / perft 5 = 312866 / 862329 / 4865609, 0 warnings; with the
# round 2 net bench 13 = 722569 as before; 700 positions at depth 9 give the same move, score and node count
# as the lock build; a self-play test ran clean. Back to the lock source: build_forge_pgo.sh and build_tag = "pgo".
# Changed again at 10:10, still before round 7: the source is now C:/nnue-lab/forge/all = the t21 source plus
# Carbon's three other branches merged here (t23 mate search and 50-move rule, t12 two-thread mate fix, t22
# three search options that are off by default). Hash list forge/all/SOURCE_INPUTS.sha256, merge notes
# forge/all/EXPORT_NOTE.txt. Checked here: 312866 / 862329 / 4865609, 0 warnings; 700 positions at depth 9
# identical to the lock build (both nets); `go mate 2` finds a mate the lock misses; Astra's two-thread mate
# position 7k/8/3K4/8/8/8/8/5R2 w: mate score in 10 of 10 runs (lock 0 of 10). The t21-only build: build_forge_t21_pgo.sh, tag "t21pgo".
# Changed 2026-11-14 18:35, before round 7 started its self-play: the source is now C:/nnue-lab/forge/r4s =
#   forge/all's twin on GitHub (integrate/combo29-all, e04556dd)
#   + grok47/r4-01-integrate-r3 at 8e805fb4 (the round-3 fixes: position parsing, helper threads obey a node
#     budget, mate scores read from the hash table, hash-table duplicates, clock safety; and 16 options, every one
#     OFF by default)
#   + four audit fixes applied by hand (r4-08 singular depth, r4-09 hash scores and the 50-move horizon,
#     r4-11, r4-12)
#   + three speed branches merged here without conflicts (r3-18 net update and output in one pass, r3-19
#     hand-written evaluation, r3-20 move generation, legality, hash probe, move picker).
# Every line was read before it was built (owner's condition of that evening). Hash list
# forge/r4s/SOURCE_INPUTS.sha256 (its own sha256 starts 1c7691b4). Checked here: 312866 / 862329 / 4865609;
# bench 13 with each option alone equals the agents' table; with the round 2 net bench 13 = 722569 as before;
# 3,000 positions (lock net) and 2,000 positions (round 2 net) at depth 9: same move, score and node count as
# forge/all in every one. Speed under load: about 2.6 % faster than forge/all (forge/r4 alone was 3 % slower,
# the speed branches give 6 %). Back to forge/all: build_forge_all_pgo.sh and build_tag = "allpgo".
# forge/r4 without the speed branches: build_forge_r4_pgo.sh, tag "r4pgo".
# Changed 2026-11-14 21:10, still before round 7's self-play: the source is now C:/nnue-lab/forge/r5 = forge/r4s
#   + Astra's mate guard (27 lines, his commit a9fddb1f, read line by line; compiled in by the build script with
#     -DFORGE_MATE_ALPHA_GUARD=1; it is the UCI option MateAlphaGuard and is OFF unless set in uci_options below)
#   + output buckets in the net code (written here that evening, about 40 lines in nnue.cpp): a net file that says
#     FORGE_NNUE_OUT_BUCKETS N has N output blocks, chosen by the number of pieces. A net file without that line
#     (every net so far) is computed exactly as before.
# Checked here: 312866 / 862329 / 4865609; with the round 2 net bench 13 = 722569; 3,000 positions (lock net) and
# 2,000 (round 2 net) at depth 9 identical to forge/r4s in move, score and nodes; option counts unchanged. With a
# test net of 8 buckets: engine and trainer agree on 19,998 of 20,000 positions and differ by 1 centipawn on 2
# (pipeline/tools/net_eval_check.py); the fast update path and the plain path search identically.
# Hash list forge/r5/SOURCE_INPUTS.sha256 (its own sha256 starts 278aef5e). Back to forge/r4s: the two lines below.
# Changed 2026-11-14 21:25, still before round 7's self-play: C:/nnue-lab/forge/r6 = forge/r5 with one function
# refined, TTEntry::score_usable (the fifty-move rule for scores read from the hash table): a score stored at
# the SAME clock is always usable; the stricter clauses of the audit fix r4-09 apply only between different clocks.
# Found through Astra's question 0008: under r4-09 the position 8/8/2n2r2/3qN1k1/8/8/8/K7 w - - 90 141 gave
# mate -6 at depth 9, the source before it mate -5; forge/r6 gives mate -5 again with the old node count.
# Checked: unit test forge/tools/test_score_usable.cpp (9 cases, r4-09's own four included); 312866 / 862329 /
# 4865609; option counts unchanged; 3,000 positions at depth 9 identical to forge/r5. Hash list
# forge/r6/SOURCE_INPUTS.sha256 (its own sha256 starts f96c63cc). Back to forge/r5: the two lines below.
# Changed 2026-11-14 22:06: the SAME source (forge/r6), built with clang instead of GCC, by the recipe of the
# lock exe in the owner's repo (forge-combo29/windows_build/BUILD_RECIPE.txt): clang 23.1.5 from the official
# llvm-mingw release 20261104 (the zip's sha256 matches GitHub's, and clang++.exe has the sha256 the recipe
# records), ThinLTO, profile-guided on bench 11/13/16, -march=znver5. The lock's own table
# (docs/overnight/RANKED.md) says the speed features in this source are worth about 2 % with GCC and about
# 10 % with clang. Measured here: 312866 / 862329 / 4865609 unchanged, all option counts unchanged, 2,000
# positions at depth 9 identical to the GCC build, and 7.0 % more nodes per second (bench 15, 9 runs each,
# under load). Play is identical; only the speed differs. Back to GCC: the two lines below.
build_cmd = '"C:/Program Files/Git/bin/bash.exe" C:/nnue-lab/forge/tools/build_forge_clang_pgo.sh "{out_exe}" "{net}"'
build_tag = "r6clang"
# Nets of the king-bucket format (files ending in .fnn3; engine source forge/r7, 2026-11-15; see
# forge/r7/EXPORT_NOTE.txt): one exe for all of them, built once into runs/forge/engines/v3-<v3_build_tag>, the
