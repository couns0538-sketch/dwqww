# Speed on the loop's self-play workload: wall 1.172 and engine CPU 1.223 of r15 (10 rounds ABBA/BAAB, 40 runs, one trace; tmp/carbon_speed/out/sp_timing_1.json).
# Back: config.forge.toml.before_r15c_1043 (exe v3-r15-clang).
# 2026-11-17 16:42 (Opus): engine source forge/r15d (forge/r15d/R15D_NOTE.txt) = forge/r15c + the helper carbon2's
